        value: ''
    - name: italian
      header: "Csv file (Italian)"
      text: "The first trail csv file for the Italian game"
      display: FileInput
      url: custom-skirmish-trails.firstedition.csv.languages.italian
      contents:
        generalizeExtensionPaths: true
        filter: files
        type: string
        value: ''
    - name: polish
      header: "Csv file (Polish)"
      text: "The first trail csv file for the Polish game"
      display: FileInput
      url: custom-skirmish-trails.firstedition.csv.languages.polish
      contents:
        generalizeExtensionPaths: true
        filter: files
        type: string
        value: ''
    - name: russian
      header: "Csv file (Russian)"
      text: "The first trail csv file for the Russian game"
      display: FileInput
      url: custom-skirmish-trails.firstedition.csv.languages.russian
      contents:
        generalizeExtensionPaths: true
        filter: files
        type: string
        value: ''
    - name: hungarian
      header: "Csv file (Hungarian)"
      text: "The first trail csv file for the Hungarian game"
      display: FileInput
      url: custom-skirmish-trails.firstedition.csv.languages.hungarian
      contents:
        generalizeExtensionPaths: true
        filter: files
        type: string
        value: ''
    - name: turkish
      header: "Csv file (Turkish)"
      text: "The first trail csv file for the Turkish game"
      display: FileInput
      url: custom-skirmish-trails.firstedition.csv.languages.turkish
      contents:
        generalizeExtensionPaths: true
        filter: files
        type: string
        value: ''
    - name: chinese
      header: "Csv file (Chinese)"
      text: "The first trail csv file for the Chinese game"
      display: FileInput
      url: custom-skirmish-trails.firstedition.csv.languages.chinese
      contents:
        generalizeExtensionPaths: true
