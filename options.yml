      contents:
        generalizeExtensionPaths: true
        filter: files
        type: string
        value: ''
  - name: filepaths
    header: "File paths"
    text: "See and clear the files set for the first trail"
    hasHeader: true
    display: CustomMenu
    url: custom-skirmish-trails.firstedition
    contents:
      type: custom
      source:
        html: file-paths.html
        css: file-paths.css
        js: file-paths.js
  - name: conversion
    header: "CSV data"
    text: "Export the first trail's csv files to one JSON file per mission, or import those JSON files back into the csv files"
    hasHeader: true
    display: CustomMenu
    url: custom-skirmish-trails.firstedition.conversion
    contents:
      type: custom
      source:
        html: csv-data-firstedition.html
        css: csv-data.css
        js: csv-data.js
