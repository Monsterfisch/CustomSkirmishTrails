options:
- category:
  - Custom Skirmish Trails
  name: firstedition
  display: GroupBox
  header: "First Edition Trail"
  text: "Customize the first trail. Normally the trail settings file is all you set here: it names the trail's mission data (trail_missions) and language files itself."
  hasHeader: true
  children:
  - name: settings
    header: "Trail settings file"
    text: "A .json file with the settings of the first trail: mission data (csv and mission JSON files), language files, title, summary, starting year, button pictures, background, mission positions and AI names (see trail-settings.schema.json). Leave empty to keep the game's own."
    display: FileInput
    url: custom-skirmish-trails.firstedition.settings.path
    contents:
      generalizeExtensionPaths: true
      filter: files
      type: string
      value: ''
  - name: csv
    header: "Csv file (without trail settings file)"
    text: "The first trail's csv file, for use without a trail settings file. A trail settings file with trail_missions takes its place."
    display: FileInput
    url: custom-skirmish-trails.firstedition.csv.path
    contents:
      generalizeExtensionPaths: true
      filter: files
      type: string
      value: ''
  - name: filepaths
    header: "File paths"
    text: "See and clear the files set for the first trail"
    hasHeader: true
    display: CustomMenu
    url: custom-skirmish-trails.firstedition
    contents:
      type: custom
      source:
        html: file-paths.html
        css: file-paths.css
        js: file-paths.js
  - name: conversion
    header: "CSV data"
    text: "Export the first trail's csv file to one JSON file per mission, or import those JSON files back into the csv file"
    hasHeader: true
    display: CustomMenu
    url: custom-skirmish-trails.firstedition.conversion
    contents:
      type: custom
      source:
        html: csv-data-firstedition.html
        css: csv-data.css
        js: csv-data.js
