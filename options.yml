options:
- category:
  - Custom Skirmish Trails
  name: firstedition
  display: GroupBox
  header: "First Edition Trail"
  text: "Customize the first trail"
  hasHeader: true
  children:
  - name: csv
    header: "First Edition Trail"
    text: "Customize the first trail with a .csv file. It is used for every game language that has no file of its own below."
    display: FileInput
    url: custom-skirmish-trails.firstedition.csv.path
    contents:
      generalizeExtensionPaths: true
      filter: files
      type: string
      value: ''
  - name: settings
    header: "Trail settings file"
    text: "A .json file with settings for the first trail as a whole: title, summary, starting year, button pictures, background, mission positions, csv files per language and AI names (see trail-settings.schema.json). Leave empty to keep the game's own."
    display: FileInput
    url: custom-skirmish-trails.firstedition.settings.path
    contents:
      generalizeExtensionPaths: true
      filter: files
      type: string
      value: ''
  - name: conversion
    header: "CSV data"
    text: "Export the first trail's csv files to one JSON file per mission, or import those JSON files back into the csv files"
    hasHeader: true
    display: CustomMenu
    url: custom-skirmish-trails.firstedition.conversion
    contents:
      type: custom
      source:
        html: csv-data-firstedition.html
        css: csv-data.css
        js: csv-data.js
  - name: languages
    display: GroupBox
    header: "Csv files per game language"
    text: "A .csv file for one game language takes the place of the file above when the game runs in that language. A trail settings file with trail_csv_files overrides these."
    hasHeader: true
    children:
    - name: english
      header: "English"
      text: "The first trail csv file for the English game"
      display: FileInput
      url: custom-skirmish-trails.firstedition.csv.languages.english
      contents:
        generalizeExtensionPaths: true
        filter: files
        type: string
        value: ''
    - name: german
      header: "German"
      text: "The first trail csv file for the German game"
      display: FileInput
      url: custom-skirmish-trails.firstedition.csv.languages.german
      contents:
        generalizeExtensionPaths: true
        filter: files
        type: string
        value: ''
