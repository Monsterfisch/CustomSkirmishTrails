- category:
  - Developer
  - Custom Skirmish Trails
  name: strict_format
  hasHeader: false
  header: "Strict mode: check the trail csv and json files in detail"
  text: "Logs every problem in the trail csv files and trail settings files, every trail setting that falls back to the game's own value, and how a trail's language csv files differ (texts left out). May show error message boxes at game start. Without it, one warning per file with problems."
  display: UCP2Switch
  url: custom-skirmish-trails.csv.strict_format
  contents:
    type: boolean
    value: false
