options:
- category:
  - Custom Skirmish Trails
  name: firstedition
  display: GroupBox
  header: "First Edition Trail"
  text: "Customize the first trail. Normally a trail settings file is all you set here; it names the trail's csv files itself."
  hasHeader: true
  children:
  - name: settings
    header: "Trail settings file"
    text: "A .json file with the settings of the first trail: csv files per language, title, summary, starting year, button pictures, background, mission positions and AI names (see trail-settings.schema.json). Leave empty to keep the game's own."
    display: FileInput
    url: custom-skirmish-trails.firstedition.settings.path
    contents:
      generalizeExtensionPaths: true
      filter: files
      type: string
      value: ''
  - name: csvfiles
    display: GroupBox
    header: "Csv files (a trail settings file with trail_csv_files takes their place)"
    text: "The first trail's csv files, for use without a trail settings file or as its fallback. The default file is used for every game language without a file of its own."
    hasHeader: true
    accordion:
      enabled: true
    children:
    - name: csv
      header: "Csv file (default)"
      text: "The first trail csv file for every game language without a file of its own"
      display: FileInput
      url: custom-skirmish-trails.firstedition.csv.path
      contents:
        generalizeExtensionPaths: true
        filter: files
        type: string
        value: ''
    - name: english
      header: "Csv file (English)"
      text: "The first trail csv file for the English game"
      display: FileInput
      url: custom-skirmish-trails.firstedition.csv.languages.english
      contents:
        generalizeExtensionPaths: true
        filter: files
        type: string
        value: ''
