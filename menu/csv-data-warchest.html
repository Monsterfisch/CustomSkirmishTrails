<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>CSV data</title>
  </head>
  <body>
    <div id="csv-data" data-trail="warchest">
      <p>Export writes every mission line of the Warchest trail's csv file into a JSON file of its own, in a folder named like the csv file next to it. Import puts those JSON files back together into the csv file.</p>
      <p>The game does the work: choose a button, press <b>Save and close</b>, then start the game once.</p>
      <div class="buttons">
        <button type="button" id="export">Export CSV Data</button>
        <button type="button" id="import">Import CSV Data</button>
      </div>
      <p id="pending"></p>
      <p id="last"></p>
    </div>
  </body>
</html>
